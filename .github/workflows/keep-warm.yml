name: Keep Render and Qdrant warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set; skipping ping."
            exit 0
          fi
          echo "Pinging $BACKEND_URL/healthz"
          curl --fail --silent --show-error --max-time 60 "$BACKEND_URL/healthz"
